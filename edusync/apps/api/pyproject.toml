[project]
name = "edusync-api"
version = "0.1.0"
description = "EduSync AI FastAPI application (mounts the C1-C4 component routers)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edusync-core",
    "edusync-c1",
    "edusync-c2",
    "edusync-c3",
    "edusync-c4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
ml = ["edusync-c1[ml]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusync_api"]
