[project]
name = "edusync-c2-model"
version = "0.1.0"
description = "C2 Phase 3: data layer and trainer for the trained difficulty model (torch-free)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edusync-c2",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusync_c2_model"]
