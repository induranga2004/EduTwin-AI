[project]
name = "edusync-c2"
version = "0.1.0"
description = "C2 Learning difficulty prediction and comprehension validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edusync-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusync_c2"]
