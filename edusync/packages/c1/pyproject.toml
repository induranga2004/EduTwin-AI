[project]
name = "edusync-c1"
version = "0.1.0"
description = "C1 Lecturer Monitoring: curriculum tracking and lecture navigation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edusync-core",
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "networkx>=3.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ml = ["faster-whisper>=1.1"]
semantic = ["sentence-transformers>=3.3"]
research = ["scikit-learn>=1.5", "pandas>=2.2", "joblib>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusync_c1"]
