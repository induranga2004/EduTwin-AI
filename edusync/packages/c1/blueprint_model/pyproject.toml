[project]
name = "edusync-blueprint-model"
version = "0.1.0"
description = "Blueprint: fine-tune MiniLM-L6-v2 for text classification on CPU, then quantize it to INT8"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Fetch the base model from Hugging Face.
download = ["huggingface_hub>=1.0"]
# Torch-free inference and INT8 quantization (ONNX Runtime).
onnx = ["onnx>=1.17", "onnxruntime>=1.20", "tokenizers>=0.21"]
# Full fine-tuning on CPU + ONNX export. torch comes from the CPU-only index (see edusync/pyproject.toml).
finetune = [
    "huggingface_hub>=1.0",
    "torch>=2.5",
    "transformers>=4.50",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]

[project.scripts]
edusync-blueprint = "edusync_blueprint_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusync_blueprint_model"]
